<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>그레이트 킹덤 GREAT KINGDOM</title></head>
<body style="margin:0;background:#0b0a08"><div id="app"></div>
<script>
/* =========================================================
   GREAT KINGDOM — 엔진 (규칙 판정)
   ========================================================= */
const GK_N = 9;
const GK_CENTER = 40;
const GK_EMPTY = 0, GK_BLUE = 1, GK_ORANGE = 2, GK_NEUTRAL = 3;
const GK_COLS = 'ABCDEFGHI';
const GK_NAME = { 1: '파랑', 2: '주황' };

function gkNew() {
  const board = new Array(81).fill(GK_EMPTY);
  board[GK_CENTER] = GK_NEUTRAL;
  return { board, turn: GK_BLUE, passes: 0, stones: { 1: 40, 2: 40 }, moves: [], lastMove: -1, over: null };
}

function gkCoord(i) { return GK_COLS[i % GK_N] + (Math.floor(i / GK_N) + 1); }

function gkNbrs(i) {
  const r = Math.floor(i / GK_N), c = i % GK_N, a = [];
  if (r > 0) a.push(i - GK_N);
  if (r < GK_N - 1) a.push(i + GK_N);
  if (c > 0) a.push(i - 1);
  if (c < GK_N - 1) a.push(i + 1);
  return a;
}

// 같은 색으로 이어진 성 무리 + 그 무리에 맞닿은 빈칸(숨구멍)
function gkGroup(b, i) {
  const col = b[i], seen = new Set([i]), stack = [i], libs = new Set();
  while (stack.length) {
    const j = stack.pop();
    for (const k of gkNbrs(j)) {
      if (b[k] === GK_EMPTY) libs.add(k);
      else if (b[k] === col && !seen.has(k)) { seen.add(k); stack.push(k); }
    }
  }
  return { stones: [...seen], libs };
}

// 영토 계산: 빈칸 영역이 한 색의 성(+가장자리/중립 성)으로만 둘러싸이고,
// 가장자리 4변을 모두 쓰지 않았으면 그 색의 영토
function gkTerritory(b) {
  const owner = new Array(81).fill(0), seen = new Uint8Array(81);
  for (let i = 0; i < 81; i++) {
    if (b[i] !== GK_EMPTY || seen[i]) continue;
    const cells = [], stack = [i], border = new Set(), edges = new Set();
    seen[i] = 1;
    while (stack.length) {
      const j = stack.pop();
      cells.push(j);
      const r = Math.floor(j / GK_N), c = j % GK_N;
      if (r === 0) edges.add('T');
      if (r === GK_N - 1) edges.add('B');
      if (c === 0) edges.add('L');
      if (c === GK_N - 1) edges.add('R');
      for (const k of gkNbrs(j)) {
        if (b[k] === GK_EMPTY) { if (!seen[k]) { seen[k] = 1; stack.push(k); } }
        else if (b[k] === GK_BLUE || b[k] === GK_ORANGE) border.add(b[k]);
      }
    }
    const o = (border.size === 1 && edges.size < 4) ? [...border][0] : 0;
    for (const j of cells) owner[j] = o;
  }
  return owner;
}

function gkScore(owner) {
  const s = { 1: 0, 2: 0 };
  for (const o of owner) if (o) s[o]++;
  return s;
}

// 착수 판정: {ok, reason} 또는 {ok:true, kind:'normal'|'capture'|'suicide', captured:[]}
function gkEvaluate(b, i, p, stones) {
  if (b[i] === GK_NEUTRAL) return { ok: false, reason: '중립 성이 있는 자리입니다.' };
  if (b[i] !== GK_EMPTY) return { ok: false, reason: '이미 성이 있는 자리입니다.' };
  const opp = 3 - p;
  if (gkTerritory(b)[i] === opp) return { ok: false, reason: GK_NAME[opp] + '의 완성된 영토에는 성을 놓을 수 없습니다.' };
  if (stones[p] <= 0) return { ok: false, reason: '남은 성이 없습니다. 패스하세요.' };
  const nb = b.slice(); nb[i] = p;
  const captured = new Set();
  for (const k of gkNbrs(i)) {
    if (nb[k] === opp && !captured.has(k)) {
      const g = gkGroup(nb, k);
      if (g.libs.size === 0) g.stones.forEach(s => captured.add(s));
    }
  }
  // 양쪽 모두 파괴되는 상황이면 놓은 쪽이 우선 → 상대 파괴를 먼저 확인
  if (captured.size) return { ok: true, kind: 'capture', captured: [...captured] };
  const own = gkGroup(nb, i);
  if (own.libs.size === 0) return { ok: true, kind: 'suicide', captured: own.stones };
  return { ok: true, kind: 'normal', captured: [] };
}

// attacker가 다음 한 수로 파괴할 수 있는 상대 성 목록 (= '공격' 상황)
function gkThreats(b, attacker, stones) {
  const res = new Set(), seen = new Set(), defender = 3 - attacker;
  for (let i = 0; i < 81; i++) {
    if (b[i] !== defender || seen.has(i)) continue;
    const g = gkGroup(b, i);
    g.stones.forEach(s => seen.add(s));
    if (g.libs.size === 1) {
      const L = [...g.libs][0];
      const ev = gkEvaluate(b, L, attacker, stones);
      if (ev.ok && ev.kind === 'capture') ev.captured.forEach(s => res.add(s));
    }
  }
  return res;
}


// 한 수 적용 (i: 칸 번호, -1 패스, -2 기권) → 새 상태. 온라인 동기화·재생에 사용
function gkApply(S0, a) {
  const S = JSON.parse(JSON.stringify(S0));
  if (S.over) return S;
  const p = (a.i === -2 && a.p) ? a.p : S.turn;
  if (a.i === -2) {
    S.moves.push({ p, i: -2 });
    S.over = { winner: 3 - p, reason: 'resign', destroyed: [] };
    return S;
  }
  if (a.i === -1) {
    S.moves.push({ p, i: -1 });
    S.passes++; S.lastMove = -1;
    if (S.passes >= 2) {
      const sc = gkScore(gkTerritory(S.board));
      S.over = { winner: (sc[1] - sc[2] >= 3) ? GK_BLUE : GK_ORANGE, reason: 'count', score: sc, destroyed: [] };
    } else S.turn = 3 - p;
    return S;
  }
  const ev = gkEvaluate(S.board, a.i, p, S.stones);
  if (!ev.ok) return null;
  S.board[a.i] = p; S.stones[p]--; S.passes = 0; S.lastMove = a.i; S.moves.push({ p, i: a.i });
  if (ev.kind === 'capture') S.over = { winner: p, reason: 'capture', destroyed: ev.captured };
  else if (ev.kind === 'suicide') S.over = { winner: 3 - p, reason: 'suicide', destroyed: ev.captured };
  else S.turn = 3 - p;
  return S;
}

// 수 목록으로 처음부터 다시 둠 → { S, hist }
function gkReplay(moves) {
  let S = gkNew(); const hist = [];
  for (const m of moves) {
    const n = gkApply(S, { i: m.i, p: m.p });
    if (!n) break;
    hist.push(S); S = n;
  }
  return { S, hist };
}

var AI_ANCHOR = true;
/* =========================================================
   GREAT KINGDOM — AI
   ========================================================= */
// 다음 한 수로 attacker가 상대 성을 파괴할 수 있는가
// (숨구멍이 1개뿐인 무리의 그 숨구멍이 상대(방어자) 영토가 아니면 파괴 가능)
function aiCanCapture(b, attacker, owner) {
  const defender = 3 - attacker;
  owner = owner || gkTerritory(b);
  const seen = new Uint8Array(81);
  for (let i = 0; i < 81; i++) {
    if (b[i] !== defender || seen[i]) continue;
    const g = gkGroup(b, i);
    for (const s of g.stones) seen[s] = 1;
    if (g.libs.size === 1) {
      const L = g.libs.values().next().value;
      if (owner[L] !== defender) return true;
    }
  }
  return false;
}

function aiApply(b, i, p) {
  const nb = b.slice(), opp = 3 - p;
  nb[i] = p;
  for (const k of gkNbrs(i)) if (nb[k] === opp && gkGroup(nb, k).libs.size === 0) return { nb, kind: 'capture' };
  if (gkGroup(nb, i).libs.size === 0) return { nb, kind: 'suicide' };
  return { nb, kind: 'normal' };
}

// 둘 만한 후보: 빈칸 중 상대 영토·내 영토가 아닌 곳
function aiCandidates(b, p) {
  const owner = gkTerritory(b), res = [];
  for (let i = 0; i < 81; i++) if (b[i] === GK_EMPTY && owner[i] === 0) res.push(i);
  return res;
}

// 형세 평가 (me 입장, 클수록 유리)
function aiEval(b, me) {
  const owner = gkTerritory(b), opp = 3 - me, infl = new Float32Array(81);
  for (let i = 0; i < 81; i++) {
    const v = b[i];
    if (v !== GK_BLUE && v !== GK_ORANGE) continue;
    const sg = v === me ? 1 : -1, r = (i / 9) | 0, c = i % 9;
    for (let dr = -3; dr <= 3; dr++) {
      const rr = r + dr; if (rr < 0 || rr > 8) continue;
      const rem = 3 - Math.abs(dr);
      for (let dc = -rem; dc <= rem; dc++) {
        const cc = c + dc; if (cc < 0 || cc > 8) continue;
        infl[rr * 9 + cc] += sg * (4 - Math.abs(dr) - Math.abs(dc));
      }
    }
  }
  let s = 0;
  for (let i = 0; i < 81; i++) {
    if (b[i] !== GK_EMPTY) continue;
    if (owner[i] === me) s += 1;
    else if (owner[i] === opp) s -= 1;
    else s += 0.45 * Math.max(-1, Math.min(1, infl[i] / 6));
  }
  const seen = new Uint8Array(81);
  for (let i = 0; i < 81; i++) {
    const v = b[i];
    if ((v !== GK_BLUE && v !== GK_ORANGE) || seen[i]) continue;
    const g = gkGroup(b, i);
    for (const st of g.stones) seen[st] = 1;
    const sg = v === me ? 1 : -1;
    if (AI_ANCHOR) {
      // 내 영토에 닿은 무리 = 절대 파괴되지 않는 기지
      let immortal = false;
      for (const L of g.libs) if (owner[L] === v) { immortal = true; break; }
      if (immortal) { s += sg * (1.2 + 0.25 * g.stones.length); continue; }
      const n = g.libs.size;
      if (n === 1) s += v === me ? -2.5 : 1.2;
      else if (n === 2) s += v === me ? -0.8 : 0.5;
      else if (n === 3) s += sg * -0.15;
    } else {
      const n = g.libs.size;
      if (n === 1) s += v === me ? -2 : 1;
      else if (n === 2) s += v === me ? -0.3 : 0.15;
    }
  }
  return s;
}

function aiPick(list) {
  let best = null;
  for (const m of list) if (!best || m.v > best.v) best = m;
  return best;
}

function aiEasy(b, me) {
  const opp = 3 - me, out = [];
  for (const i of aiCandidates(b, me)) {
    const r = aiApply(b, i, me);
    if (r.kind === 'suicide') continue;
    out.push({ i, r });
  }
  if (!out.length) return null;
  const caps = out.filter(m => m.r.kind === 'capture');
  if (caps.length && Math.random() < 0.6) return caps[0];
  let pool = out;
  if (Math.random() < 0.5) { const safe = out.filter(m => !aiCanCapture(m.r.nb, opp)); if (safe.length) pool = safe; }
  pool.forEach(m => { m.v = aiEval(m.r.nb, me) + Math.random() * 4; });
  return aiPick(pool);
}

function aiNormal(b, me) {
  const opp = 3 - me, out = [];
  for (const i of aiCandidates(b, me)) {
    const r = aiApply(b, i, me);
    if (r.kind === 'capture') return { i, v: 9999 };
    if (r.kind === 'suicide') continue;
    const v = aiCanCapture(r.nb, opp) ? -1000 : aiEval(r.nb, me) + Math.random() * 0.5;
    out.push({ i, v });
  }
  return aiPick(out);
}

function aiHard(b, me) {
  const opp = 3 - me, first = [];
  for (const i of aiCandidates(b, me)) {
    const r = aiApply(b, i, me);
    if (r.kind === 'capture') return { i, v: 9999 };
    if (r.kind === 'suicide') continue;
    const v = aiCanCapture(r.nb, opp) ? -1000 : aiEval(r.nb, me) + Math.random() * 0.05;
    first.push({ i, v, nb: r.nb });
  }
  if (!first.length) return null;
  first.sort((a, c) => c.v - a.v);
  const top = first.filter(m => m.v > -500).slice(0, 12);
  if (!top.length) return first[0];
  for (const t of top) {
    let worst = t.v; // 상대가 패스하는 경우
    const replies = [];
    for (const o of aiCandidates(t.nb, opp)) {
      const rr = aiApply(t.nb, o, opp);
      if (rr.kind === 'capture') { worst = -1000; break; }
      if (rr.kind === 'suicide') continue;
      replies.push({ nb: rr.nb, v: aiEval(rr.nb, me) });
    }
    if (worst > -1000) {
      replies.sort((a, c) => a.v - c.v);
      for (const rp of replies.slice(0, 6)) {
        const val = aiCanCapture(rp.nb, me) ? 500 : rp.v;
        if (val < worst) worst = val;
      }
    }
    t.score = worst;
  }
  let best = top[0];
  for (const t of top) if (t.score > best.score) best = t;
  return best;
}

// 쉬움: 한 수 앞을 보지만 실수가 섞임
function aiEasy2(b, me) {
  const opp = 3 - me, out = [];
  for (const i of aiCandidates(b, me)) {
    const r = aiApply(b, i, me);
    if (r.kind === 'capture') { if (Math.random() < 0.85) return { i, v: 9999 }; continue; }
    if (r.kind === 'suicide') continue;
    const careless = Math.random() < 0.3;
    const v = (!careless && aiCanCapture(r.nb, opp)) ? -1000 : aiEval(r.nb, me) + Math.random() * 2;
    out.push({ i, v });
  }
  return aiPick(out);
}

// 반환: 둘 칸 번호, 패스면 -1
function aiChooseMove(S, me, level) {
  const b = S.board;
  if (S.stones[me] <= 0) return -1;
  if (S.passes === 1) {
    const sc = gkScore(gkTerritory(b));
    if (((sc[1] - sc[2] >= 3) ? GK_BLUE : GK_ORANGE) === me) return -1; // 지금 끝내면 이김 → 패스
  }
  let m;
  if (level === 'hard' || level === 'master') m = srChoose(b, me, AI_LEVELS[level]);
  else m = (level === 'easy' ? aiEasy2 : aiHard)(b, me);
  if (!m) return -1;
  if (S.moves.length > 20 && (m.v == null || m.v > -500)) {
    const after = aiApply(b, m.i, me);
    if (after.kind === 'normal' && aiEval(after.nb, me) < aiEval(b, me) - 0.6 && !srThreats(b, me, gkTerritory(b)).size) return -1; // 둘수록 손해면 패스
  }
  return m.i;
}

/* ---------- 수읽기 AI (어려움 · 고수) ---------- */
const AI_WIN = 100000;

// p 차례에서 p가 바로 파괴할 수 있는가
function srCanWin(b, p, owner) {
  const opp = 3 - p, seen = new Uint8Array(81);
  for (let i = 0; i < 81; i++) {
    if (b[i] !== opp || seen[i]) continue;
    const g = gkGroup(b, i);
    for (const s of g.stones) seen[s] = 1;
    if (g.libs.size === 1) {
      const L = g.libs.values().next().value;
      if (owner[L] !== opp) return L;
    }
  }
  return -1;
}

// 상대가 p의 성을 파괴하려고 노리는 칸들
function srThreats(b, p, owner) {
  const res = new Set(), seen = new Uint8Array(81);
  for (let i = 0; i < 81; i++) {
    if (b[i] !== p || seen[i]) continue;
    const g = gkGroup(b, i);
    for (const s of g.stones) seen[s] = 1;
    if (g.libs.size === 1) {
      const L = g.libs.values().next().value;
      if (owner[L] !== p) res.add(L);
    }
  }
  return res;
}

// 영토에 닿아 있지 않은(파괴 가능한) 상대 무리 중 숨구멍이 3개인 무리의 숨구멍 → 몰아붙이기 수
function srSqueezeMoves(b, p, owner) {
  const opp = 3 - p, res = new Set(), seen = new Uint8Array(81);
  for (let i = 0; i < 81; i++) {
    if (b[i] !== opp || seen[i]) continue;
    const g = gkGroup(b, i);
    for (const s of g.stones) seen[s] = 1;
    if (g.libs.size !== 3) continue;
    let immortal = false;
    for (const L of g.libs) if (owner[L] === opp) { immortal = true; break; }
    if (immortal) continue;
    for (const L of g.libs) if (owner[L] === 0) res.add(L);
  }
  return [...res];
}
// p가 두면 상대 무리를 단수(숨구멍 1개)로 만드는 칸
function srAtariMoves(b, p, owner) {
  const opp = 3 - p, res = new Set(), seen = new Uint8Array(81);
  for (let i = 0; i < 81; i++) {
    if (b[i] !== opp || seen[i]) continue;
    const g = gkGroup(b, i);
    for (const s of g.stones) seen[s] = 1;
    if (g.libs.size === 2) for (const L of g.libs) if (owner[L] === 0) res.add(L);
  }
  return [...res];
}

function srChildren(b, p, moves, ctx) {
  const out = [];
  for (const i of moves) {
    const r = aiApply(b, i, p);
    if (r.kind === 'suicide') continue;
    out.push({ i, nb: r.nb, kind: r.kind });
  }
  return out;
}

function srOrder(kids, p) {
  for (const k of kids) k.v = aiEval(k.nb, p);
  kids.sort((a, c) => c.v - a.v);
  return kids;
}

function srSearch(b, p, depth, alpha, beta, ply, ctx) {
  if ((++ctx.nodes & 255) === 0 && Date.now() > ctx.deadline) throw ctx;
  const owner = gkTerritory(b);
  if (srCanWin(b, p, owner) >= 0) return AI_WIN - ply;
  const threats = srThreats(b, p, owner);
  let moves, standPat = null;

  if (depth <= 0) {
    if (!threats.size) {
      standPat = aiEval(b, p);
      if (depth <= -ctx.qdepth || standPat >= beta) return standPat;
      if (standPat > alpha) alpha = standPat;
      moves = srAtariMoves(b, p, owner).slice(0, 5);
      if (depth > -ctx.sqDepth) for (const m of srSqueezeMoves(b, p, owner).slice(0, 4)) if (!moves.includes(m)) moves.push(m);
    } else {
      if (depth <= -ctx.qdepth) return aiEval(b, p) - 3;
      moves = [...threats];
    }
  } else {
    moves = threats.size ? [...threats] : aiCandidates(b, p);
  }

  let kids = srChildren(b, p, moves, ctx);
  if (!kids.length) {
    if (threats.size) return -(AI_WIN - ply - 1);
    return standPat != null ? standPat : aiEval(b, p);
  }
  if (depth >= 1 && kids.length > 1) {
    srOrder(kids, p);
    const w = ply === 0 ? ctx.rootWidth : ctx.width;
    if (!threats.size && kids.length > w) {
      // 숨구멍 2개짜리 무리의 숨구멍(방어·공격 급소)은 항상 읽는다
      const urgent = new Set(), seen = new Uint8Array(81);
      for (let i = 0; i < 81; i++) {
        const v = b[i];
        if ((v !== GK_BLUE && v !== GK_ORANGE) || seen[i]) continue;
        const g = gkGroup(b, i);
        for (const st of g.stones) seen[st] = 1;
        if (g.libs.size === 2) for (const L of g.libs) urgent.add(L);
      }
      kids = kids.slice(0, w).concat(kids.slice(w).filter(k => urgent.has(k.i)));
    }
  }
  let best = standPat != null ? standPat : -Infinity;
  for (const k of kids) {
    const v = -srSearch(k.nb, 3 - p, depth - 1, -beta, -alpha, ply + 1, ctx);
    if (ply === 0) ctx.rootScores[k.i] = v;
    if (v > best) { best = v; if (ply === 0) ctx.bestMove = k.i; }
    if (v > alpha) alpha = v;
    if (alpha >= beta) break;
  }
  return best;
}

// 반복 심화: 시간 안에서 최대한 깊이 읽기
function srBestMove(b, p, opt) {
  const owner = gkTerritory(b);
  const win = srCanWin(b, p, owner);
  if (win >= 0) return { i: win, v: AI_WIN };
  let result = null;
  const ctx = {
    deadline: Date.now() + opt.timeMs, nodes: 0, qdepth: opt.qdepth, sqDepth: opt.sqDepth || 0,
    width: opt.width, rootWidth: opt.rootWidth, bestMove: -1
  };
  for (let d = 1; d <= opt.maxDepth; d++) {
    ctx.bestMove = -1; ctx.rootScores = {};
    try {
      const v = srSearch(b, p, d, -Infinity, Infinity, 0, ctx);
      if (ctx.bestMove >= 0) result = { i: ctx.bestMove, v, depth: d, scores: ctx.rootScores };
      if (v >= AI_WIN - 50 || v <= -(AI_WIN - 50)) break; // 승패가 보이면 그만
    } catch (e) {
      if (e !== ctx) throw e;
      break;
    }
  }
  return result;
}

// 수읽기 + 사활 확인: 강제로 잡는 수가 있으면 두고, 내 무리가 잡히는 수는 피한다
function srChoose(b, p, opt) {
  const res = srBestMove(b, p, opt);
  if (!opt.lifeMs || (res && res.v >= AI_WIN - 50)) return res;
  const kill = lkFindKill(b, p, opt.lifeMs * 0.5, opt.lifeN);
  if (kill >= 0) return { i: kill, v: AI_WIN - 10, kill: true };
  if (!res) return res;
  const order = Object.entries(res.scores || {}).map(([i, v]) => ({ i: +i, v })).sort((x, y) => y.v - x.v);
  if (!order.some(o => o.i === res.i)) order.unshift({ i: res.i, v: res.v });
  const until = Date.now() + opt.lifeMs * 0.5;
  for (const o of order.slice(0, 8)) {
    if (Date.now() > until) break;
    if (!lkUnsafe(b, o.i, p, Math.max(80, (until - Date.now()) / 3), opt.safeN)) return Object.assign({}, res, { i: o.i, v: o.v, checked: o.i !== res.i });
  }
  // 상위 후보가 모두 위험하면: 약한 내 무리 주변(숨구멍·그 옆)에서 안전한 수를 찾는다
  const owner = gkTerritory(b), seen = new Uint8Array(81), def = new Set();
  for (let i = 0; i < 81; i++) {
    if (b[i] !== p || seen[i]) continue;
    const g = gkGroup(b, i);
    for (const st of g.stones) seen[st] = 1;
    if (g.libs.size <= 3 && !lkImmortal(g, owner, p)) for (const c of lkCands(b, g, owner, p)) def.add(c);
  }
  let pick = null;
  const until2 = Date.now() + opt.lifeMs * 0.5;
  for (const c of def) {
    if (Date.now() > until2) break;
    const r = aiApply(b, c, p);
    if (r.kind === 'suicide') continue;
    if (lkUnsafe(b, c, p, 150, opt.safeN)) continue;
    const v = aiEval(r.nb, p);
    if (!pick || v > pick.v) pick = { i: c, v };
  }
  if (pick) return Object.assign({}, res, { i: pick.i, v: pick.v, checked: true, rescue: true });
  return res;
}

/* ---------- 사활 판단: 무리를 끝까지 몰아 잡을 수 있는가 ---------- */
// 이 게임은 '영토에 닿으면 불사', '하나라도 파괴되면 즉시 패배'이므로
// 숨구멍 3개 이하 무리의 생사를 따로 깊이 읽는다.
function lkCands(b, g, owner, mover) {
  const foe = 3 - mover, set = new Set();
  const ok = c => b[c] === GK_EMPTY && owner[c] !== foe;
  for (const L of g.libs) {
    if (ok(L)) set.add(L);
    for (const k of gkNbrs(L)) if (ok(k)) set.add(k);
  }
  return [...set];
}
// 수비 후보: 숨구멍과 그 옆 + 무리 주변 2칸 + 무리에 붙은 공격 무리의 숨구멍(역공)
function lkDefCands(b, g, owner, d, a) {
  const set = new Set(lkCands(b, g, owner, d));
  const ok = c => b[c] === GK_EMPTY && owner[c] !== a;
  const seenA = new Set();
  for (const s of g.stones) {
    const r = (s / 9) | 0, c = s % 9;
    for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) {
      if (Math.abs(dr) + Math.abs(dc) > 2) continue;
      const rr = r + dr, cc = c + dc; if (rr < 0 || rr > 8 || cc < 0 || cc > 8) continue;
      const k = rr * 9 + cc; if (ok(k)) set.add(k);
    }
    for (const k of gkNbrs(s)) if (b[k] === a && !seenA.has(k)) {
      const ag = gkGroup(b, k); ag.stones.forEach(x => seenA.add(x));
      if (ag.libs.size <= 2) for (const L of ag.libs) if (ok(L)) set.add(L);
    }
  }
  return [...set];
}
function lkImmortal(g, owner, color) { for (const L of g.libs) if (owner[L] === color) return true; return false; }

// 공격 a 차례: 무리(t 포함)를 n수 안에 파괴할 수 있으면 첫 수(또는 -2: 이미 단수), 없으면 -1
function lkKill(b, t, a, n, ctx) {
  if ((++ctx.nodes & 127) === 0 && Date.now() > ctx.deadline) throw ctx;
  const key = 'A' + n + t + b.join('');
  if (ctx.memo.has(key)) return ctx.memo.get(key);
  const d = 3 - a, owner = gkTerritory(b);
  let res = -1;
  if (srCanWin(b, a, owner) >= 0) res = srCanWin(b, a, owner);
  else {
    const g = gkGroup(b, t);
    if (!lkImmortal(g, owner, d) && n > 1 && g.libs.size <= 4) {
      for (const m of lkCands(b, g, owner, a)) {
        const r = aiApply(b, m, a);
        if (r.kind === 'suicide') continue;
        if (r.kind === 'capture') { res = m; break; }
        if (!lkLive(r.nb, t, a, n - 1, ctx)) { res = m; break; }
      }
    }
  }
  ctx.memo.set(key, res);
  return res;
}
// 수비 차례: 살 수 있으면 true
function lkLive(b, t, a, n, ctx) {
  const key = 'D' + n + t + b.join('');
  if (ctx.memo.has(key)) return ctx.memo.get(key);
  const d = 3 - a, owner = gkTerritory(b);
  let res = false;
  if (srCanWin(b, d, owner) >= 0) res = true;
  else {
    const g = gkGroup(b, t);
    if (lkImmortal(g, owner, d) || g.libs.size >= 5) res = true;
    else {
      const th = srThreats(b, d, owner);
      const cands = th.size ? [...th] : lkDefCands(b, g, owner, d, a);
      for (const m of cands) {
        const r = aiApply(b, m, d);
        if (r.kind === 'capture') { res = true; break; }
        if (r.kind === 'suicide') continue;
        if (lkKill(r.nb, t, a, n, ctx) < 0) { res = true; break; }
      }
      if (!res && !th.size && lkKill(b, t, a, n, ctx) < 0) res = true;   // 손 빼기(다른 곳에 두기)
    }
  }
  ctx.memo.set(key, res);
  return res;
}

// me가 강제로 상대 무리를 잡는 첫 수 (없으면 -1)
function lkFindKill(b, me, ms, n) {
  const ctx = { deadline: Date.now() + ms, nodes: 0, memo: new Map() };
  const owner = gkTerritory(b), opp = 3 - me, seen = new Uint8Array(81);
  try {
    for (let i = 0; i < 81; i++) {
      if (b[i] !== opp || seen[i]) continue;
      const g = gkGroup(b, i);
      for (const s of g.stones) seen[s] = 1;
      if (g.libs.size > 3 || lkImmortal(g, owner, opp)) continue;
      const m = lkKill(b, i, me, n, ctx);
      if (m >= 0) return m;
    }
  } catch (e) { if (e !== ctx) throw e; }
  return -1;
}
// me가 i에 둔 뒤 상대가 내 무리를 강제로 잡을 수 있는가 (true = 위험)
function lkUnsafe(b, i, me, ms, n) {
  const r = aiApply(b, i, me);
  if (r.kind === 'capture') return false;
  if (r.kind === 'suicide') return true;
  return lkFindKill(r.nb, 3 - me, ms, n) >= 0;
}

/* =========================================================
   GREAT KINGDOM — 연습모드 (문제 판정 + 스테이지)
   ========================================================= */
// p가 n수 안에 상대 성을 반드시 파괴할 수 있는가 (단수로 몰아붙이는 수만 읽음)
function pzWinsIn(b, p, n) {
  const owner = gkTerritory(b);
  if (srCanWin(b, p, owner) >= 0) return true;
  if (n <= 1) return false;
  for (const m of srAtariMoves(b, p, owner)) {
    const r = aiApply(b, m, p);
    if (r.kind !== 'normal') continue;
    if (!pzDefends(r.nb, 3 - p, p, n - 1)) return true;
  }
  return false;
}
// 수비 d 차례: 공격 p의 n수 파괴를 막을 수 있는가
function pzDefends(b, d, p, n) {
  const owner = gkTerritory(b);
  if (srCanWin(b, d, owner) >= 0) return true;
  const th = srThreats(b, d, owner);
  if (!th.size) {
    if (!pzWinsIn(b, p, n)) return true;           // 그냥 두어도(패스) 안전
    const seen = new Uint8Array(81), tries = new Set();
    for (let i = 0; i < 81; i++) {                  // 숨구멍 2개 이하인 무리를 이어 나가기
      if (b[i] !== d || seen[i]) continue;
      const g = gkGroup(b, i);
      for (const s of g.stones) seen[s] = 1;
      if (g.libs.size <= 2) for (const L of g.libs) if (owner[L] !== p) tries.add(L);
    }
    for (const L of tries) {
      const r = aiApply(b, L, d);
      if (r.kind === 'capture') return true;
      if (r.kind === 'normal' && !pzWinsIn(r.nb, p, n)) return true;
    }
    return false;
  }
  for (const L of th) {
    const r = aiApply(b, L, d);
    if (r.kind === 'capture') return true;
    if (r.kind === 'suicide') continue;
    if (!pzWinsIn(r.nb, p, n)) return true;
  }
  return false;
}
// 수비 AI의 응수: 가장 오래 버티는 수
function pzDefenderReply(b, d, p, n) {
  const owner = gkTerritory(b);
  const win = srCanWin(b, d, owner);
  if (win >= 0) return win;
  const th = srThreats(b, d, owner);
  if (th.size) {
    let fallback = -1;
    for (const L of th) {
      const r = aiApply(b, L, d);
      if (r.kind === 'capture') return L;
      if (r.kind === 'suicide') continue;
      if (fallback < 0) fallback = L;
      if (!pzWinsIn(r.nb, p, n)) return L;
    }
    if (fallback >= 0) return fallback;
  }
  const m = srBestMove(b, d, { maxDepth: 3, width: 8, rootWidth: 12, qdepth: 4, timeMs: 600 });
  return m ? m.i : -1;
}

// '잡기' 문제의 수비 AI: 대상 무리가 가장 오래 사는 수
function pzKillReply(b, t, n) {
  const owner = gkTerritory(b);
  const w = srCanWin(b, 2, owner);
  if (w >= 0) return w;
  const ctx = { deadline: Date.now() + 1500, nodes: 0, memo: new Map() };
  const g = gkGroup(b, t), th = srThreats(b, 2, owner);
  const cands = th.size ? [...th] : lkDefCands(b, g, owner, 2, 1);
  let fallback = -1, best = -1;
  try {
    for (const m of cands) {
      const r = aiApply(b, m, 2);
      if (r.kind === 'capture') return m;
      if (r.kind === 'suicide') continue;
      const libs = gkGroup(r.nb, t).libs.size;
      if (libs > best) { best = libs; fallback = m; }
      if (lkKill(r.nb, t, 1, n, ctx) < 0) return m;
    }
  } catch (e) { if (e !== ctx) throw e; }
  return fallback;
}
function pzKillHint(b, t, n) {
  const ctx = { deadline: Date.now() + 2000, nodes: 0, memo: new Map() };
  try { return lkKill(b, t, 1, n, ctx); } catch (e) { return -1; }
}

function pzBoard(rows) {
  const b = [];
  rows.forEach(r => { for (const ch of r) b.push(ch === 'B' ? 1 : ch === 'O' ? 2 : ch === '+' ? 3 : 0); });
  b[GK_CENTER] = GK_NEUTRAL;
  return b;
}
function pzIdx(s) { return (+s.slice(1) - 1) * 9 + GK_COLS.indexOf(s[0]); }

// 한 수 판정 문제: true = 정답
function pzCheckOne(stage, b, i) {
  const P = 1, O = 2, g = stage.goal;
  const r = aiApply(b, i, P);
  if (r.kind === 'suicide') return { ok: false, why: '내 성이 갇혀 파괴되는 자리예요.' };
  if (g.type === 'capture') return r.kind === 'capture' ? { ok: true } : { ok: false };
  if (r.kind === 'capture') return { ok: true };
  const nb = r.nb;
  if (srCanWin(nb, O, gkTerritory(nb)) >= 0) return { ok: false, why: '이렇게 두면 상대가 바로 내 성을 파괴해요.' };
  if (g.type === 'save') {
    return pzWinsIn(nb, O, g.depth) ? { ok: false, why: '아직 숨구멍이 부족해서 상대가 계속 몰아붙여 파괴할 수 있어요.' } : { ok: true };
  }
  if (g.type === 'deny' || g.type === 'diff') {
    let worst = Infinity, worstMove = -1;
    const replies = [-1];
    for (const j of aiCandidates(nb, O)) replies.push(j);
    for (const j of replies) {
      let nb2 = nb;
      if (j >= 0) { const r2 = aiApply(nb, j, O); if (r2.kind !== 'normal') continue; nb2 = r2.nb; }
      const sc = gkScore(gkTerritory(nb2));
      const val = g.type === 'deny' ? -sc[O] : sc[P] - sc[O];
      if (val < worst) { worst = val; worstMove = j; }
    }
    const ok = g.type === 'deny' ? -worst < g.target : worst >= g.target;
    return ok ? { ok: true } : { ok: false, reply: worstMove };
  }
  return { ok: false };
}

// p가 n수 안에 파괴하는 첫 수 (없으면 -1)
function pzFindWin(b, p, n) {
  const owner = gkTerritory(b);
  const w = srCanWin(b, p, owner);
  if (w >= 0) return w;
  if (n <= 1) return -1;
  for (const m of srAtariMoves(b, p, owner)) {
    const r = aiApply(b, m, p);
    if (r.kind !== 'normal') continue;
    if (!pzDefends(r.nb, 3 - p, p, n - 1)) return m;
  }
  return -1;
}

  /* ---------- 모달 ---------- */

  root.appendChild(wrap);

  /* ---------- 동작 ---------- */
  function onCell(i) {
    if (view === 'practice') { pzClick(i); return; }
    if (view === 'review') return;
    if (S.over || aiTurn()) return;
    if (online()) {
      if (!net.connected) { note = '상대와 연결되지 않았어요. 잠시 기다려 주세요.'; render(); return; }
      if (!myTurnOnline()) { note = '상대 차례예요.'; render(); return; }
    }
    const ev = gkEvaluate(S.board, i, S.turn, S.stones);
    if (!ev.ok) { note = '✕ ' + ev.reason; render(); return; }
    if (ev.kind === 'suicide' && pendingSuicide !== i) {
      pendingSuicide = i;
      note = '⚠ 여기에 두면 내 성이 갇혀 파괴되고 패배합니다. 그래도 두려면 한 번 더 누르세요.';
      render(); return;
    }
    doMove(i, ev);
  }

  function doMove(i, ev) {
    const n = gkApply(S, { i });
    if (!n) return;
    hist.push(S); S = n;
    pendingSuicide = -1; note = '';
    if (online()) sendState();
    render();
    if (S.over) setTimeout(showResult, 450);
    else maybeAI();
  }

  function pass() {
    if (S.over || aiTurn()) return;
    if (online() && (!net.connected || !myTurnOnline())) return;
    doPass();
  }

  function passNote() {
    const last = S.moves[S.moves.length - 1];
    if (S.over || !last || last.i !== -1) return '';
    const next = S.turn;
    const meNext = (cfg.mode === 'ai' && !isAI(next)) || (online() && next === net.myColor);
    return who(last.p) + '이 패스했습니다. ' + (meNext ? '나도' : GK_NAME[next] + '도') + ' 패스하면 게임이 끝나고 영토를 셉니다.';
  }

  function doPass() {
    hist.push(S); S = gkApply(S, { i: -1 });
    pendingSuicide = -1;
    if (online()) sendState();
    if (S.over) { note = ''; render(); setTimeout(showResult, 300); return; }
    note = passNote();
    render();
    maybeAI();
  }

  function resign() {
    if (S.over) return;
    if (!confirm('정말 기권할까요?')) return;
    stopAI();
    const me = online() ? net.myColor : (cfg.mode === 'ai' ? cfg.human : S.turn);
    hist.push(S); S = gkApply(S, { i: -2, p: me });
    if (online()) sendState();
    render(); setTimeout(showResult, 300);
  }

  function maybeAI() {
    if (!aiTurn()) return;
    thinking = true; render();
    clearTimeout(aiTimer);
    aiTimer = setTimeout(() => {
      thinking = false;
      if (!aiTurn()) { render(); return; }
      const i = aiChooseMove(S, S.turn, cfg.level);
      if (i < 0) { doPass(); return; }
      const ev = gkEvaluate(S.board, i, S.turn, S.stones);
      if (!ev.ok) { doPass(); return; }
      doMove(i, ev);
    }, 550);
  }

  function stopAI() { clearTimeout(aiTimer); thinking = false; }

  function undo() {
    if (!hist.length) return;
    if (online()) {
      if (!net.connected) return;
      if (!S.moves.some(m => m.p === net.myColor)) return;
      netSend({ type: 'undoReq' }); note = '상대에게 무르기를 요청했어요…'; render(); return;
    }
    stopAI();
    S = hist.pop();
    // AI 대전: AI 수까지 함께 물러서 내 차례로
    if (cfg.mode === 'ai' && isAI(S.turn) && hist.length) S = hist.pop();
    pendingSuicide = -1; note = '한 수 물렀습니다.';
    closeModal(); render(); maybeAI();
  }

  function reset() {
    if (online()) { requestRematch(); return; }
    stopAI(); S = gkNew(); hist = []; pendingSuicide = -1; note = ''; closeModal(); render(); maybeAI();
  }

  function openSetup() {
    const tmp = Object.assign({}, cfg);
    const chip = (on, label, sub) =>
      '<div style="flex:1;cursor:pointer;text-align:center;padding:10px 6px;border-radius:10px;border:1px solid ' + (on ? '#d4af37' : '#3a3122') +
      ';background:' + (on ? '#3a2e14' : '#14110c') + ';color:' + (on ? '#f3d98b' : '#cfc5aa') + ';font-weight:' + (on ? '700' : '500') + ';font-size:15px">' +

  function showResult() {

  function onKey(e) {
    if (e.key === 'Escape') { closeModal(); return; }
    if (view === 'review' && overlay.style.display !== 'flex') {
      if (e.key === 'ArrowLeft') { rvGo(rv.k - 1); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { rvGo(rv.k + 1); e.preventDefault(); }
      return;
    }
    if (overlay.style.display === 'flex' || view !== 'game') return;
    if (e.target && (e.target.tagName === 'INPUT')) return;
    if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); undo(); return; }
    if (e.key === 'p' || e.key === 'P' || e.key === 'ㅔ') pass();
  }
  window.addEventListener('keydown', onKey);

  /* ---------- 그리기 ---------- */
  function render() {
    tabGame.style.background = view === 'game' ? '#3a2e14' : 'transparent';
    tabGame.style.color = view === 'game' ? '#f3d98b' : '#a39876';
    tabGame.style.borderColor = view === 'game' ? '#d4af37' : '#3a3122';
    tabPz.style.background = view === 'practice' ? '#3a2e14' : 'transparent';
    tabPz.style.color = view === 'practice' ? '#f3d98b' : '#a39876';
    tabPz.style.borderColor = view === 'practice' ? '#d4af37' : '#3a3122';
    gamePanel.style.display = view === 'game' ? 'flex' : 'none';
    pzPanel.style.display = view === 'practice' ? 'flex' : 'none';
    rvPanel.style.display = view === 'review' ? 'flex' : 'none';
    if (view === 'review') { tabGame.style.background = '#3a2e14'; tabGame.style.color = '#f3d98b'; tabGame.style.borderColor = '#d4af37'; renderReview(); return; }
    if (view === 'practice') { renderPractice(); return; }
    const b = S.board, owner = gkTerritory(b), sc = gkScore(owner);
    const threatened = S.over ? new Set() : gkThreats(b, 3 - S.turn, S.stones);
    const destroyed = new Set((S.over && S.over.destroyed) || []);
    const showOwner = showTerr || (S.over && S.over.reason === 'count');
    const num = {};
    if (S.over && S.over.reason === 'count') {
      const cnt = { 1: 0, 2: 0 };
      for (let i = 0; i < 81; i++) if (owner[i]) num[i] = ++cnt[owner[i]];
    }

    for (let i = 0; i < 81; i++) {
      const el = cells[i], v = b[i], o = owner[i];
      let bg = '#2a251c';
      if (v === GK_EMPTY && o && showOwner) bg = o === 1 ? '#1f3566' : '#55311a';
      el.style.background = bg;
      el.style.cursor = (S.over || aiTurn()) ? 'default' : 'pointer';
      let inner = '';
      if (v === GK_NEUTRAL) {
        inner = piece(3);
      } else if (v === GK_BLUE || v === GK_ORANGE) {
        const pulse = threatened.has(i) ? 'animation:gkPulse 1.1s ease-in-out infinite;border-radius:16%;' : '';
        inner = '<div style="width:100%;height:100%;' + pulse + '">' + piece(v) + '</div>';
        if (destroyed.has(i)) inner +=
          '<svg viewBox="0 0 100 100" style="position:absolute;inset:0;width:100%;height:100%"><path d="M18 18 L82 82 M82 18 L18 82" stroke="#ffffff" stroke-width="15" stroke-linecap="round"/><path d="M18 18 L82 82 M82 18 L18 82" stroke="#e0473a" stroke-width="9" stroke-linecap="round"/></svg>';
        if (i === S.lastMove && !destroyed.has(i)) inner +=
          '<div style="position:absolute;right:-3px;top:-3px;width:28%;height:28%;border-radius:50%;background:#f3d98b;border:2px solid #100e0a;box-shadow:0 0 8px #d4af37"></div>';
      } else {
        if (num[i]) {
          inner = '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:min(3.4vw,24px);color:' +
            (o === 1 ? '#a9bcff' : '#ffb27a') + '">' + num[i] + '</div>';
        } else if (!S.over && !aiTurn() && i === hover) {
          const ev = gkEvaluate(b, i, S.turn, S.stones);
          if (!ev.ok) {
            inner = '<svg viewBox="0 0 100 100" width="100%" height="100%" style="display:block"><path d="M28 28 L72 72 M72 28 L28 72" stroke="#e0473a" stroke-width="10" stroke-linecap="round" opacity="0.85"/></svg>';
          } else {
            inner = '<div style="width:100%;height:100%;' + (ev.kind === 'suicide' ? 'box-shadow:0 0 0 3px #e0473a;border-radius:16%;' : '') +
              (ev.kind === 'capture' ? 'box-shadow:0 0 0 3px #f3d98b,0 0 14px 4px rgba(243,217,139,.8);border-radius:16%;' : '') + '">' +
              piece(S.turn, 0.5) + '</div>';
          }
        } else if (i === pendingSuicide) {
          inner = '<div style="width:100%;height:100%;box-shadow:0 0 0 3px #e0473a;border-radius:16%">' + piece(S.turn, 0.5) + '</div>';
        }
      }
      el.innerHTML = inner ? '<div style="position:absolute;inset:6%">' + inner + '</div>' : '';
    }

    // 차례 카드
    const modeLine = '<div style="margin-top:10px;padding-top:8px;border-top:1px solid #2e2719;font-size:12px;color:#8a7f63">' +
      (online() ? '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:' + (net.connected ? '#5fd36b' : '#e0473a') +
        ';box-shadow:0 0 6px ' + (net.connected ? '#5fd36b' : '#e0473a') + '"></span>🌐 온라인 · 방 <b style="color:#f3d98b;letter-spacing:1px">' + net.code + '</b> · ' +
        (net.connected ? (net.via === 'relay' ? '연결됨 · 중계' : '연결됨 · 직접') : '연결 끊김') :
      cfg.mode === 'ai' ? '🤖 AI 대전 · ' + LEVEL_NAME[cfg.level] + ' · 나는 <span style="color:' + nameColor(cfg.human) + '">' + GK_NAME[cfg.human] + '</span>' : '👥 2인 대전') + '</div>';
    if (S.over) {
      turnCard.innerHTML =
        '<div style="display:flex;align-items:center;gap:14px"><div style="width:52px">' + piece(S.over.winner) + '</div>' +
        '<div><div style="font-size:12px;color:#a39876;letter-spacing:3px">게임 종료</div>' +
        '<div style="font-family:' + SERIF + ';font-size:24px;color:#d4af37">' + (cfg.mode === 'ai' ? (isAI(S.over.winner) ? 'AI 승리' : '내가 이겼다!') : GK_NAME[S.over.winner] + ' 승리!') + '</div></div></div>' + modeLine;
    } else {
      const p = S.turn, ai = isAI(p);
      turnCard.innerHTML =
        '<div style="display:flex;align-items:center;gap:14px"><div style="width:52px;filter:drop-shadow(0 0 10px ' + (p === 1 ? 'rgba(80,120,255,.6)' : 'rgba(255,130,50,.6)') + ')">' + piece(p) + '</div>' +
        '<div style="flex:1"><div style="font-size:12px;color:#a39876;letter-spacing:3px">' + (S.moves.length + 1) + '수째 · 차례</div>' +
        '<div style="font-family:' + SERIF + ';font-size:24px;color:' + nameColor(p) + '">' + GK_NAME[p] + ' <span style="font-size:14px;color:#a39876">' +
        (online() ? (p === net.myColor ? '나' : (net.oppName || '상대')) : cfg.mode === 'ai' ? (ai ? 'AI' : '나') : (p === 1 ? '선공' : '후공')) + '</span></div>' +
        (online() && p !== net.myColor && net.connected ? '<div style="font-size:12.5px;color:#a39876;animation:gkBlink 1.4s ease-in-out infinite">상대가 생각 중…</div>' : '') +
        (ai && thinking ? '<div style="font-size:12.5px;color:#f3d98b;animation:gkBlink 1s ease-in-out infinite">🤖 생각 중…</div>' : '') + '</div>' +
        '<div style="text-align:right"><div style="font-size:11px;color:#a39876">남은 성</div><div style="font-family:' + SERIF + ';font-size:22px;color:#efe6cf">' + S.stones[p] + '</div></div></div>' + modeLine;
    }

    // 점수 카드
    const d = sc[1] - sc[2];
    const row = p =>
      '<div style="display:flex;align-items:center;gap:10px;padding:6px 0">' +
      '<div style="width:26px">' + piece(p) + '</div>' +
      '<div style="flex:1;font-size:14px">' + who(p) + ' <span style="color:#a39876;font-size:12px">· 남은 성 ' + S.stones[p] + '</span></div>' +
      '<div style="font-family:' + SERIF + ';font-size:24px;color:' + nameColor(p) + ';min-width:34px;text-align:right">' + sc[p] + '</div></div>';
    const lead = d >= 3 ? 1 : 2;
    scoreCard.innerHTML =
      '<div style="font-family:' + SERIF + ';color:#d4af37;font-size:14px;letter-spacing:2px;margin-bottom:4px;display:flex;justify-content:space-between"><span>영 토</span><span style="font-family:' + SANS + ';font-size:11px;color:#8a7230;letter-spacing:0">칸 수</span></div>' +
      row(1) + '<div style="height:1px;background:#2e2719"></div>' + row(2) +
      '<div style="margin-top:8px;padding-top:9px;border-top:1px dashed #3a3122;font-size:13px;color:#d9cfb5">현재 형세: <b style="color:' + nameColor(lead) + '">' + GK_NAME[lead] + ' 우세</b>' +
      ' <span style="color:#a39876">(차이 ' + (d >= 0 ? '+' : '') + d + ')</span>' +
      '<div style="font-size:11.5px;color:#8a7f63;margin-top:3px">파랑(선공)은 영토가 3개 이상 많아야 승리</div></div>';

    // 공격 알림
    if (threatened.size) {
      const atk = 3 - S.turn;
      alertBox.style.display = 'block';
      alertBox.innerHTML = '<div style="font-family:' + SERIF + ';font-size:20px;color:#ff8a7a;margin-bottom:3px;letter-spacing:2px">⚔️ 공격!</div>' +
        who(atk) + '이 다음 수에 ' + who(S.turn) + '의 성을 파괴할 수 있습니다. <b>빨갛게 빛나는 성</b>을 지키세요!';
    } else alertBox.style.display = 'none';

    noteBox.textContent = note;

    // 버튼
    passBtn.disabled = !!S.over || aiTurn() || (online() && (!myTurnOnline() || !net.connected));
    undoBtn.disabled = !hist.length || (online() && (!net.connected || !S.moves.some(m => m.p === net.myColor)));
    undoBtn.innerHTML = online() ? '↶ 무르기 요청' : '↶ 무르기';
    resignBtn.disabled = !!S.over;
    reactCard.style.display = online() ? 'block' : 'none';
    newBtn.innerHTML = online() ? '나가기 / 새 게임' : '새 게임 / 설정';
    if (online() && !net.connected && !S.over) {
      alertBox.style.display = 'block';
      alertBox.innerHTML = '<div style="font-family:' + SERIF + ';font-size:18px;color:#ff8a7a;margin-bottom:3px">📡 연결 끊김</div>' +
        (net.started ? '상대와의 연결이 끊겼어요. 다시 접속하면 이어서 둘 수 있어요.' : '상대를 기다리는 중이에요.');
    }
    terrBtn.innerHTML = '영토 표시 ' + (showTerr ? '<b style="color:#f3d98b">ON</b>' : '<span style="opacity:.6">OFF</span>');

    kifuSaveBtn.disabled = !S.moves.length;
    reviewBtn.disabled = S.moves.length < 2;
    // 기보
    if (!S.moves.length) kifuList.innerHTML = '<div style="color:#6f6650;grid-column:1/3">아직 둔 수가 없습니다.</div>';
    else {
      kifuList.innerHTML = S.moves.map((m, k) =>
        '<div><span style="color:#6f6650;display:inline-block;width:26px">' + (k + 1) + '.</span>' +
        '<span style="color:' + nameColor(m.p) + '">' + GK_NAME[m.p] + (isAI(m.p) ? '<span style="font-size:10px;color:#8a7f63"> AI</span>' : '') + '</span> ' +
        (m.i < 0 ? '<span style="color:#a39876">패스</span>' : '<b>' + gkCoord(m.i) + '</b>') + '</div>').join('');
      kifuList.scrollTop = kifuList.scrollHeight;
    }
  }

  /* =========================================================
     연습모드
     ========================================================= */
  const X_SVG = '<svg viewBox="0 0 100 100" style="position:absolute;inset:0;width:100%;height:100%"><path d="M18 18 L82 82 M82 18 L18 82" stroke="#ffffff" stroke-width="15" stroke-linecap="round"/><path d="M18 18 L82 82 M82 18 L18 82" stroke="#e0473a" stroke-width="9" stroke-linecap="round"/></svg>';
  const BIG = { 1: 99, 2: 99 };

  function pzStart(k) {
    stopAI();
    const st = PZ_STAGES[k];
    pz = { k, board: pzBoard(st.rows), used: 0, done: null, why: '', destroyed: [], lastMove: -1, hint: -1, busy: false,
      msg: '', marks: [] };
    view = 'practice';
    closeModal(); render();
  }

  function pzLeft() { const g = PZ_STAGES[pz.k].goal; return (g.moves || 1) - pz.used; }

  function pzFinish(ok, why) {
    pz.done = ok ? 'win' : 'fail'; pz.why = why || ''; pz.busy = false; pz.hint = -1;
    render();
    if (ok) {
      cleared[pz.k] = true; saveCleared();
      setTimeout(pzSuccessModal, 500);
    }
  }

  function pzSuccessModal() {
    const st = PZ_STAGES[pz.k], next = pz.k + 1 < PZ_STAGES.length ? pz.k + 1 : -1;
    const allDone = PZ_STAGES.every((_, k) => cleared[k]);
    openModal(
      '<div style="text-align:center;font-family:' + SERIF + ';color:#a39876;letter-spacing:5px;font-size:13px">' + st.ch + '장 · ' + CH_NAME[st.ch] + '</div>' +
      '<div style="text-align:center;font-size:44px;margin:8px 0 2px">🎉</div>' +
      '<div style="text-align:center;font-family:' + SERIF + ';font-size:28px;color:#d4af37;text-shadow:0 2px 12px rgba(212,175,55,.4)">성공!</div>' +
      '<div style="text-align:center;font-size:14px;color:#a39876;margin:2px 0 16px">' + stageLabel(pz.k) + ' ' + st.title + '</div>' +
      '<div style="background:#14110c;border:1px solid #3a3122;border-left:3px solid #d4af37;border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.7;color:#d9cfb5">' +
      '<div style="font-size:12px;color:#d4af37;letter-spacing:2px;margin-bottom:4px">📌 기억하기</div>' + st.tip + '</div>' +
      (allDone ? '<div style="margin-top:14px;text-align:center;font-size:14px;color:#f3d98b">모든 연습을 마쳤어요! 이제 AI와 실전 대결을 해 보세요.</div>' : ''),
      next >= 0
        ? [['판 보기', closeModal], ['다음 단계 ▶', () => pzStart(next), true]]
        : [['판 보기', closeModal], ['⚔️ 실전 대전', () => { view = 'game'; render(); openSetup(); }, true]]
    );
  }

  const stageLabel = k => { const ch = PZ_STAGES[k].ch; return ch + '-' + (PZ_STAGES.filter((s, j) => s.ch === ch && j <= k).length); };

  function pzPlace(i, p) {
    const ev = gkEvaluate(pz.board, i, p, BIG);
    pz.board[i] = p; pz.lastMove = i;
    if (ev.kind === 'capture') pz.destroyed = ev.captured;
    return ev;
  }

  function pzClick(i) {
    if (!pz || pz.done || pz.busy) return;
    const st = PZ_STAGES[pz.k], g = st.goal, b = pz.board;
    const ev = gkEvaluate(b, i, 1, BIG);
    if (!ev.ok) { pz.msg = '✕ ' + ev.reason; render(); return; }
    if (ev.kind === 'suicide') { pz.msg = '✕ 그 자리는 내 성이 갇혀서 파괴돼요.'; render(); return; }
    pz.hint = -1; pz.msg = ''; pz.marks = [];

    if (g.type === 'save' || g.type === 'deny' || g.type === 'diff') {
      const res = pzCheckOne(st, b, i);
      pzPlace(i, 1); pz.used++;
      if (res.ok) { pzFinish(true); return; }
      // 실패: 상대의 응수를 보여 주기
      pz.busy = true; render();
      setTimeout(() => {
        let reply = res.reply != null ? res.reply : -1, why = res.why || '';
        if (g.type === 'save' && reply < 0) reply = pzFindWin(pz.board, 2, g.depth);
        if (reply >= 0) {
          const ev2 = pzPlace(reply, 2);
          if (g.type === 'save') why = why || '주황이 ' + gkCoord(reply) + '에 두며 계속 몰아붙여요. 숨구멍이 금방 다시 막혀요.';
          if (ev2.kind === 'capture') why = '주황이 ' + gkCoord(reply) + '에 두어 내 성을 파괴했어요.';
          else if (g.type === 'deny') why = '주황이 ' + gkCoord(reply) + '에 두면 영토를 완성할 수 있어요.';
          else if (g.type === 'diff') {
            const sc = gkScore(gkTerritory(pz.board));
            why = '주황이 ' + gkCoord(reply) + '에 두면 영토가 파랑 ' + sc[1] + ' : 주황 ' + sc[2] + '이 돼요.';
          }
        }
        pzFinish(false, why || '정답이 아니에요.');
      }, 650);
      return;
    }

    pzPlace(i, 1); pz.used++;
    if (g.type === 'territory') {
      const sc = gkScore(gkTerritory(pz.board));
      if (sc[1] >= g.target) { pzFinish(true); return; }
      if (pzLeft() <= 0) { pzFinish(false, '영토가 ' + sc[1] + '칸이에요. ' + g.target + '칸을 만들어야 해요.'); return; }
      pz.msg = '좋아요! 주황은 쉬고 있어요. 한 수 더 두세요.';
      render(); return;
    }
    if (g.type === 'capture' || g.type === 'kill') {
      if (ev.kind === 'capture') { pzFinish(true); return; }
      if (pzLeft() <= 0) { pzFinish(false, g.moves + '수 안에 파괴하지 못했어요.'); return; }
      pz.busy = true; pz.msg = '🤖 주황이 막을 곳을 찾는 중…'; render();
      setTimeout(() => {
        const j = g.type === 'kill' ? pzKillReply(pz.board, pzIdx(g.target), pzLeft()) : pzDefenderReply(pz.board, 2, 1, pzLeft());
        if (j >= 0 && pz.board[j] === GK_EMPTY) {
          const ev2 = pzPlace(j, 2);
          if (ev2.kind === 'capture') { pzFinish(false, '주황이 ' + gkCoord(j) + '에 두어 내 성을 먼저 파괴했어요.'); return; }
          pz.msg = '주황이 ' + gkCoord(j) + '에 두었어요. 남은 수: ' + pzLeft();
        } else pz.msg = '주황이 패스했어요. 남은 수: ' + pzLeft();
        pz.busy = false; render();
      }, 600);
    }
  }

  function pzHint() {
    if (!pz || pz.done || pz.busy) return;
    const st = PZ_STAGES[pz.k], g = st.goal;
    let h = -1;
    if (pz.used === 0) h = pzIdx(st.hint);
    else if (g.type === 'capture') h = pzFindWin(pz.board, 1, pzLeft());
    else if (g.type === 'kill') h = pzKillHint(pz.board, pzIdx(g.target), pzLeft());
    else if (g.type === 'territory') {
      for (let i = 0; i < 81 && h < 0; i++) {
        if (pz.board[i] !== GK_EMPTY) continue;
        const r = aiApply(pz.board, i, 1);
        if (r.kind === 'normal' && gkScore(gkTerritory(r.nb))[1] >= g.target) h = i;
      }
    }
    if (h < 0) { pz.msg = '이미 정답에서 벗어났어요. ↺ 다시 하기를 눌러 보세요.'; render(); return; }
    pz.hint = h; pz.msg = '💡 금색으로 빛나는 칸을 잘 살펴보세요.'; render();
  }

  function openStageList() {
    let html = '<div style="font-family:' + SERIF + ';color:#d4af37;font-size:22px;text-align:center;letter-spacing:3px">연습모드</div>' +
      '<div style="text-align:center;font-size:13px;color:#a39876;margin:4px 0 6px">단계를 하나씩 깨면서 그레이트 킹덤의 전략을 배워요</div>';
    for (let ch = 1; ch <= 6; ch++) {
      html += '<div style="font-size:13px;color:#d4af37;letter-spacing:2px;margin:16px 0 7px">' + ch + '장 · ' + CH_NAME[ch] + '</div>' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px">';
      PZ_STAGES.forEach((st, k) => {
        if (st.ch !== ch) return;
        const done = !!cleared[k], open = isUnlocked(k);
        html += '<div class="gk-stage" data-k="' + k + '" style="cursor:' + (open ? 'pointer' : 'default') + ';padding:9px 10px;border-radius:9px;' +
          'border:1px solid ' + (done ? '#8a7230' : open ? '#5a4b2c' : '#2a241a') + ';background:' + (done ? '#2a2210' : open ? '#1a160f' : '#100e0a') + ';' +
          'opacity:' + (open ? 1 : 0.45) + ';font-size:13.5px;color:' + (open ? '#efe6cf' : '#6f6650') + '">' +
          '<span style="color:' + (done ? '#f3d98b' : '#8a7230') + ';font-weight:700;margin-right:5px">' + (done ? '✓' : open ? stageLabel(k) : '🔒') + '</span>' +
          (done ? '<span style="color:#a39876;margin-right:4px">' + stageLabel(k) + '</span>' : '') + st.title + '</div>';
      });
      html += '</div>';
    }
    const n = cleared.filter(Boolean).length;
    html += '<div style="margin-top:16px;font-size:12.5px;color:#a39876;text-align:center">완료 ' + n + ' / ' + PZ_STAGES.length + '</div>';
    openModal(html, [['진행 초기화', () => { if (confirm('연습 기록을 모두 지울까요?')) { cleared = []; saveCleared(); openStageList(); } }],
      ['닫기', () => { closeModal(); if (!pz) { view = 'game'; render(); } }, true]], false, true);
    modal.querySelectorAll('[data-k]').forEach(el => {
      const k = +el.getAttribute('data-k');
      if (isUnlocked(k)) el.addEventListener('click', () => pzStart(k));
    });
  }

  function openHome() {
    openModal(
      '<div style="text-align:center;font-family:' + SERIF + ';color:#d4af37;font-size:24px;letter-spacing:4px;margin-bottom:6px">어서 오세요</div>' +
      '<div style="text-align:center;font-size:14px;color:#a39876;margin-bottom:6px">무엇을 할까요?</div>',
      [['📘 연습모드', () => { openStageList(); }], ['🌐 온라인', () => openOnline()], ['⚔️ 대전하기', () => openSetup(), true]]
    );
  }

  function renderPractice() {
    if (!pz) pzStart(0);
    const st = PZ_STAGES[pz.k], g = st.goal, b = pz.board, owner = gkTerritory(b);
    const threatened = pz.done ? new Set() : gkThreats(b, 2, BIG);
    const destroyed = new Set(pz.destroyed);
    for (let i = 0; i < 81; i++) {
      const el = cells[i], v = b[i], o = owner[i];
      el.style.background = (v === GK_EMPTY && o) ? (o === 1 ? '#1f3566' : '#55311a') : '#2a251c';

      if (v === GK_NEUTRAL) inner = piece(3);

        inner = '<div style="width:100%;height:100%;' + pulse + '">' + piece(v) + '</div>';
        if (destroyed.has(i)) inner += X_SVG;

          '<div style="position:absolute;right:-3px;top:-3px;width:28%;height:28%;border-radius:50%;background:#f3d98b;border:2px solid #100e0a;box-shadow:0 0 8px #d4af37"></div>';
      } else if (i === pz.hint) {
        inner = '<div style="width:100%;height:100%;border-radius:16%;animation:gkHint 1.2s ease-in-out infinite"></div>';
      } else if (!pz.done && !pz.busy && i === hover) {

        inner = (!ev.ok || ev.kind === 'suicide')
          ? '<svg viewBox="0 0 100 100" width="100%" height="100%" style="display:block"><path d="M28 28 L72 72 M72 28 L28 72" stroke="#e0473a" stroke-width="10" stroke-linecap="round" opacity="0.85"/></svg>'
          : '<div style="width:100%;height:100%">' + piece(1, 0.5) + '</div>';

      el.innerHTML = inner ? '<div style="position:absolute;inset:6%">' + inner + '</div>' : '';
    }

    const sc = gkScore(owner);
    let goalLine = '';
    if (g.type === 'capture' || g.type === 'kill') goalLine = g.moves === 1 ? '한 수로 해결' : '남은 수 <b style="color:#f3d98b;font-size:16px">' + Math.max(0, pzLeft()) + '</b> / ' + g.moves;
    else if (g.type === 'territory') goalLine = '내 영토 <b style="color:#8fa8ff;font-size:16px">' + sc[1] + '</b> / ' + g.target + '칸 · 남은 수 <b style="color:#f3d98b">' + Math.max(0, pzLeft()) + '</b>';
    else goalLine = '한 수로 해결';
    pzLesson.innerHTML =
      '<div style="font-size:12px;color:#a39876;letter-spacing:2px">' + st.ch + '장 · ' + CH_NAME[st.ch] + '</div>' +
      '<div style="font-family:' + SERIF + ';font-size:21px;color:#d4af37;margin:3px 0 10px"><span style="color:#8a7230;font-size:16px;margin-right:6px">' + stageLabel(pz.k) + '</span>' + st.title + '</div>' +
      '<div style="font-size:14px;line-height:1.7;color:#d9cfb5">' + st.lesson + '</div>' +
      '<div style="margin-top:12px;padding:10px 12px;background:#14110c;border:1px solid #3a3122;border-radius:9px">' +
      '<div style="font-size:12px;color:#d4af37;letter-spacing:2px;margin-bottom:3px">🎯 목표</div>' +
      '<div style="font-size:14.5px;line-height:1.6;color:#efe6cf">' + st.task + '</div>' +
      '<div style="font-size:12.5px;color:#a39876;margin-top:6px">' + goalLine + '</div></div>';

    if (pz.done === 'win') {
      pzStatus.style.background = '#1c1a0c'; pzStatus.style.borderColor = '#d4af37';
      pzStatus.innerHTML = '<div style="font-family:' + SERIF + ';font-size:20px;color:#f3d98b">🎉 성공!</div><div style="color:#d9cfb5">' + st.tip + '</div>';
    } else if (pz.done === 'fail') {
      pzStatus.style.background = '#2a0f0c'; pzStatus.style.borderColor = '#e0473a';
      pzStatus.innerHTML = '<div style="font-family:' + SERIF + ';font-size:20px;color:#ff8a7a">아쉬워요!</div><div style="color:#ffd6d0">' + pz.why +
        '</div><div style="color:#a39876;font-size:13px;margin-top:4px">↺ 다시 하기를 눌러 다시 도전하세요. 막히면 💡 힌트!</div>';
    } else {
      pzStatus.style.background = '#16130e'; pzStatus.style.borderColor = '#3a3122';
      pzStatus.innerHTML = '<div style="color:' + (pz.msg ? '#f3d98b' : '#8a7f63') + '">' + (pz.msg || '파랑(나)의 차례예요. 칸을 눌러 성을 놓으세요.') + '</div>';
    }

    const n = cleared.filter(Boolean).length, tot = PZ_STAGES.length;

  /* =========================================================
     복기: 판 전체를 분석해 승부처·최선의 수 보여 주기
     ========================================================= */
  let rv = null;
  const RV_OPT = { maxDepth: 6, width: 10, rootWidth: 20, qdepth: 8, sqDepth: 2, timeMs: 380, lifeMs: 300, lifeN: 4, safeN: 3 };
  // 이 수를 둔 뒤 상대가 강제로 이기는가
  function rvOppWins(board, i, p) {
    const r = aiApply(board, i, p);
    if (r.kind === 'capture') return false;
    if (r.kind === 'suicide') return true;
    if (lkFindKill(r.nb, 3 - p, 250, 4) >= 0) return true;
    const x = srBestMove(r.nb, 3 - p, Object.assign({}, RV_OPT, { timeMs: 400 }));
    return !!(x && x.v >= AI_WIN - 50);
  }
  const fmtMove = m => m.i === -1 ? '패스' : m.i === -2 ? '기권' : gkCoord(m.i);

  function startReview() {
    if (S.moves.length < 2) return;
    stopAI(); closeModal();
    const r = gkReplay(S.moves);
    const states = r.hist.concat([r.S]);
    rv = { moves: S.moves.slice(), states, n: S.moves.length, k: S.moves.length, an: [], marks: [], done: false, showBest: true,
      names: { 1: who(1), 2: who(2) }, token: Math.random(), verified: {} };
    view = 'review'; render();
    const token = rv.token;
    let p = 0;
    const step = () => {
      if (!rv || rv.token !== token) return;
      if (p >= rv.n) {
        // 2단계: '결정적 실수' 후보 검증 — 추천 수를 뒀다면 정말 버틸 수 있었나?
        classify();
        const cand = rv.marks.map((mk, k) => mk === '??' ? k : -1).filter(k => k >= 0 && rv.verified[k] === undefined);
        if (cand.length) {
          const k = cand[0], a = rv.an[k], mv = rv.moves[k], st0 = rv.states[k];
          rv.verified[k] = (a.best >= 0 && a.best !== mv.i) ? !rvOppWins(st0.board, a.best, mv.p) : false;
          render(); setTimeout(step, 0); return;
        }
        rv.done = true; classify(); render(); return;
      }
      const st = rv.states[p];
      let a = { status: 'normal', best: -1, v: 0 };
      if (!st.over) {
        const kill = lkFindKill(st.board, st.turn, 160, 4);
        const res = kill >= 0 ? null : srChoose(st.board, st.turn, RV_OPT);
        if (kill >= 0) a = { status: 'win', best: kill, v: AI_WIN };
        else if (res) a = { status: res.v >= AI_WIN - 50 ? 'win' : res.v <= -(AI_WIN - 50) ? 'loss' : 'normal', best: res.i, v: res.v };
      }
      rv.an[p] = a; p++;
      classify(); render();
      setTimeout(step, 0);
    };
    setTimeout(step, 30);
  }

  // 수마다 판정: '??' 결정적 실수, '?' 승리를 놓침, '!' 승리를 굳힌 수
  function classify() {
    const m = [];
    for (let k = 0; k < rv.n; k++) {
      const pre = rv.an[k], post = rv.an[k + 1], nextS = rv.states[k + 1];
      if (!pre) { m[k] = null; continue; }
      const mv = rv.moves[k];
      let mark = '';
      const capturedWin = nextS && nextS.over && nextS.over.winner === mv.p && nextS.over.reason !== 'count';
      if (capturedWin) mark = '!';
      else if (post || (nextS && nextS.over)) {
        const postStatus = post ? post.status : 'normal';
        if (pre.status !== 'loss' && postStatus === 'win') mark = '??';
        else if (pre.status === 'win' && postStatus !== 'loss') mark = '?';
        else if (pre.status === 'win' && postStatus === 'loss') mark = '!';
      }
      if (mv.i === -2) mark = pre.status === 'loss' ? '' : '??';
      // '승리를 놓침'이라도 다음 내 차례에 여전히 이기는 흐름이면 표시하지 않음
      if (mark === '?' && rv.an[k + 2] && rv.an[k + 2].status === 'win') mark = '!';
      // '결정적 실수'는 추천 수가 실제로 버티는 경우에만 (검증 실패 시 이미 진 장면)
      if (mark === '??' && rv.verified[k] === false) mark = '';
      m[k] = mark;
    }
    rv.marks = m;
  }

  function rvGo(k) { if (!rv) return; rv.k = Math.max(0, Math.min(rv.n, k)); render(); }

  function rvExplain(k) {
    // k: 다음에 둘 수의 번호(0부터). 현재 판 = states[k]
    if (k >= rv.n) {
      const o = rv.states[rv.n].over;
      return o ? '대국 종료 — <b>' + esc(rv.names[o.winner]) + ' 승리</b>' + (o.reason === 'capture' ? ' (성 파괴)' : o.reason === 'resign' ? ' (기권)' : o.reason === 'count' ? ' (영토 계산)' : '') : '여기까지 둔 판이에요.';
    }
    const mv = rv.moves[k], a = rv.an[k], mark = rv.marks[k], nm = esc(rv.names[mv.p]);
    let t = '<div style="font-size:12.5px;color:#a39876">' + (k + 1) + '수째 · ' + nm + '의 차례</div>' +
      '<div style="font-size:17px;margin:2px 0 6px">둔 수: <b style="color:' + nameColor(mv.p) + '">' + fmtMove(mv) + '</b> ' +
      (mark === '??' ? '<span style="color:#ff7a6a;font-weight:800">?? 결정적 실수</span>' : mark === '?' ? '<span style="color:#ffb27a;font-weight:800">? 승리를 놓침</span>' :
        mark === '!' ? '<span style="color:#8fe39a;font-weight:800">! 좋은 수</span>' : '') + '</div>';
    if (!a) return t + '<div style="color:#a39876">분석 중이에요…</div>';
    const best = a.best >= 0 ? gkCoord(a.best) : null, same = a.best === mv.i;
    if (mark === '??') t += '이 수 뒤로 <b>상대가 반드시 이기는 길</b>이 생겼어요.' + (best && !same ? ' 추천 수는 <b style="color:#f3d98b">' + best + '</b>였어요(금색 표시).' : '');
    else if (mark === '?') t += '여기서는 <b>반드시 이기는 수</b>가 있었는데 놓쳤어요.' + (best ? ' 정답은 <b style="color:#f3d98b">' + best + '</b>!' : '');
    else if (mark === '!') t += a.status === 'win' ? '<b>승리로 가는 정확한 수</b>예요.' : '좋은 수예요.';
    else if (a.status === 'loss') t += '이미 상대가 이기는 흐름이었어요. 어떤 수를 둬도 막기 어려운 장면이에요.';
    else if (a.status === 'win') t += '이 장면은 <b>' + nm + '이 이기는 길</b>이 있었어요.' + (best ? ' 추천: <b style="color:#f3d98b">' + best + '</b>' : '');
    else t += same ? '엔진도 같은 수를 골랐어요. 👍' : (best ? '엔진 추천은 <b style="color:#f3d98b">' + best + '</b>예요. 큰 차이는 없는 장면이에요.' : '');
    return t;
  }

  function renderReview() {
    if (!rv) { view = 'game'; render(); return; }
    const st = rv.states[rv.k], b = st.board, owner = gkTerritory(b);
    const next = rv.k < rv.n ? rv.moves[rv.k] : null, a = rv.an[rv.k];
    const destroyed = new Set(rv.k === rv.n && st.over ? (st.over.destroyed || []) : []);
    const num = {}; rv.moves.slice(0, rv.k).forEach((m, j) => { if (m.i >= 0) num[m.i] = j + 1; });
    const lastI = rv.k > 0 ? rv.moves[rv.k - 1].i : -1;
    for (let i = 0; i < 81; i++) {
      const el = cells[i], v = b[i], o = owner[i];
      el.style.background = (v === GK_EMPTY && o) ? (o === 1 ? '#1f3566' : '#55311a') : '#2a251c';
      el.style.cursor = 'default';
      let inner = '';
      if (v === GK_NEUTRAL) inner = piece(3);
      else if (v) {
        inner = '<div style="width:100%;height:100%">' + piece(v) + '</div>' +
          '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:min(2.6vw,17px);text-shadow:0 0 3px #000,0 0 3px #000">' + (num[i] || '') + '</div>';
        if (destroyed.has(i)) inner += '<svg viewBox="0 0 100 100" style="position:absolute;inset:0;width:100%;height:100%"><path d="M18 18 L82 82 M82 18 L18 82" stroke="#ff5a48" stroke-width="9" stroke-linecap="round" opacity=".85"/></svg>';
        if (i === lastI) inner += '<div style="position:absolute;right:-3px;top:-3px;width:26%;height:26%;border-radius:50%;background:#f3d98b;border:2px solid #100e0a"></div>';
      } else {
        if (rv.showBest && a && a.best === i && next && next.i !== i) inner += '<div style="width:100%;height:100%;border-radius:16%;box-shadow:0 0 0 3px #f3d98b,0 0 14px 4px rgba(243,217,139,.7)">' + piece(next.p, 0.55) + '</div>';
        if (next && next.i === i) inner += '<div style="position:absolute;inset:0;border-radius:16%;border:3px dashed ' + (rv.marks[rv.k] === '??' || rv.marks[rv.k] === '?' ? '#ff7a6a' : '#efe6cf') + '"></div>' +
          '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:min(2.6vw,16px);color:' + nameColor(next.p) + '">' + (rv.k + 1) + '</div>';
      }
      el.innerHTML = inner ? '<div style="position:absolute;inset:6%">' + inner + '</div>' : '';
    }
    const doneN = rv.an.filter(Boolean).length;
    rvHead.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-family:' + SERIF + ';font-size:20px;color:#d4af37;letter-spacing:3px">📊 복 기</span>' +
      '<span style="font-size:13px;color:#a39876">' + rv.k + ' / ' + rv.n + '수</span></div>' +
      (rv.done ? '<div style="font-size:12.5px;color:#8fe39a;margin-top:6px">분석 완료 · ←/→ 키로 한 수씩 볼 수 있어요</div>' :
        '<div style="font-size:12.5px;color:#a39876;margin:6px 0 4px">' + (doneN < rv.n ? 'AI가 판을 분석하는 중… ' + doneN + ' / ' + rv.n : '승부처를 다시 확인하는 중…') + '</div>' +
        '<div style="height:6px;background:#0e0c08;border-radius:3px;overflow:hidden"><div style="height:100%;width:' + (doneN / rv.n * 100) + '%;background:#d4af37"></div></div>');
    rvInfo.innerHTML = rvExplain(rv.k) +
      (rv.k < rv.n ? '<div style="font-size:12px;color:#8a7f63;margin-top:8px">점선 = 실제로 둔 수 · 금색 = 엔진 추천 수</div>' : '');
    rvBestBtn.innerHTML = '추천 수 ' + (rv.showBest ? '<b style="color:#f3d98b">보기</b>' : '<span style="opacity:.6">숨기기</span>');
    const keys = [];
    rv.marks.forEach((mk, k) => { if (mk === '??' || mk === '?') keys.push(k); });
    const firstWin = rv.marks.findIndex((mk, k) => mk === '!' && rv.an[k] && rv.an[k].status === 'win');
    if (firstWin >= 0 && !keys.includes(firstWin)) keys.push(firstWin);
    keys.sort((x, y) => x - y);
    rvKeys.innerHTML = '<div style="font-size:13px;color:#d4af37;letter-spacing:2px;margin-bottom:8px">승부처</div>' +
      (keys.length ? keys.map(k => {
        const mk = rv.marks[k], mv = rv.moves[k];
        const col = mk === '??' ? '#ff7a6a' : mk === '?' ? '#ffb27a' : '#8fe39a';
        const lab = mk === '??' ? '결정적 실수' : mk === '?' ? '승리를 놓침' : '승리를 굳힌 수';
        return '<div data-rk="' + k + '" class="gk-stage" style="cursor:pointer;padding:7px 9px;border:1px solid #3a3122;border-radius:8px;margin-bottom:6px;font-size:13.5px;background:' + (rv.k === k ? '#2a2210' : '#14110c') + '">' +
          '<b style="color:' + col + '">' + mk + '</b> ' + (k + 1) + '수 <span style="color:' + nameColor(mv.p) + '">' + esc(rv.names[mv.p]) + '</span> <b>' + fmtMove(mv) + '</b>' +
          ' <span style="color:#a39876;font-size:12px">· ' + lab + (rv.an[k] && rv.an[k].best >= 0 && rv.an[k].best !== mv.i ? ' (추천 ' + gkCoord(rv.an[k].best) + ')' : '') + '</span></div>';
      }).join('') : '<div style="font-size:13px;color:#8a7f63">' + (rv.done ? '뚜렷한 결정적 장면이 없었어요. 형세 차이로 승부가 난 판이에요.' : '분석이 끝나면 여기에 표시돼요.') + '</div>');
    rvKeys.querySelectorAll('[data-rk]').forEach(el => el.addEventListener('click', () => rvGo(+el.getAttribute('data-rk'))));
    rvList.innerHTML = '<div style="font-size:13px;color:#d4af37;letter-spacing:2px;margin-bottom:8px">수순</div>' +
      '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-height:170px;overflow-y:auto">' +
      rv.moves.map((mv, k) => {
        const mk = rv.marks[k] || '', col = mk === '??' ? '#ff7a6a' : mk === '?' ? '#ffb27a' : mk === '!' ? '#8fe39a' : '#6f6650';
        return '<div data-mk="' + k + '" style="cursor:pointer;font-size:12.5px;padding:3px 5px;border-radius:5px;background:' + (rv.k === k ? '#3a2e14' : 'transparent') + '">' +
          '<span style="color:#6f6650">' + (k + 1) + '.</span> <span style="color:' + nameColor(mv.p) + '">' + fmtMove(mv) + '</span> <b style="color:' + col + '">' + mk + '</b></div>';
      }).join('') + '</div>';
    rvList.querySelectorAll('[data-mk]').forEach(el => el.addEventListener('click', () => rvGo(+el.getAttribute('data-mk'))));
  }

  /* =========================================================
     기보 이미지 저장
     ========================================================= */
  function kifuCanvas() {
    const SC = 2, W = 1200, H = 760;
    const cv = document.createElement('canvas'); cv.width = W * SC; cv.height = H * SC;
    const x = cv.getContext('2d'); x.scale(SC, SC);
    const KS = "'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif";
    const KR = "'AppleMyungjo','Batang','Noto Serif KR','Noto Serif CJK KR',Georgia,serif";
    const rr = (px, py, w, hh, r) => { x.beginPath(); x.moveTo(px + r, py); x.arcTo(px + w, py, px + w, py + hh, r); x.arcTo(px + w, py + hh, px, py + hh, r); x.arcTo(px, py + hh, px, py, r); x.arcTo(px, py, px + w, py, r); x.closePath(); };
    const g = x.createRadialGradient(W / 2, 0, 50, W / 2, 0, 900); g.addColorStop(0, '#221d13'); g.addColorStop(1, '#0b0a08');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.strokeStyle = '#d4af37'; x.lineWidth = 2; rr(14, 14, W - 28, H - 28, 16); x.stroke();
    x.strokeStyle = '#8a7230'; x.lineWidth = 1; rr(20, 20, W - 40, H - 40, 12); x.stroke();
    // 제목
    x.textAlign = 'center'; x.fillStyle = '#d4af37'; x.font = '600 34px ' + KR; x.fillText('GREAT KINGDOM', W / 2, 68);
    const now = new Date(), pad = n => String(n).padStart(2, '0');
    const dateStr = now.getFullYear() + '. ' + (now.getMonth() + 1) + '. ' + now.getDate() + '. ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
    const modeStr = online() ? '온라인 대전 · 방 ' + net.code : cfg.mode === 'ai' ? 'AI 대전 · ' + LEVEL_NAME[cfg.level] : '2인 대전';

  // ── 연결 실패 판정: 직접 연결과 중계 연결이 모두 안 될 때만 ──

  // ── 직접 연결 (PeerJS / WebRTC) ──

  // ── 중계 연결 (MQTT 공개 서버) : 직접 연결이 막힌 네트워크용 ──
  function makeRelayConn(client, pubTopic, from) {
    const ev = {};
    const c = {
      open: false, closed: false, relay: true, client, last: Date.now(),
      on(t, f) { (ev[t] = ev[t] || []).push(f); },
      emit(t, a) { (ev[t] || []).slice().forEach(f => { try { f(a); } catch (e) { console.error(e); } }); },
      raw(o) { try { client.publish(pubTopic, JSON.stringify(from ? Object.assign({ from }, o) : o)); } catch (e) {} },
      send(o) { if (c.open) c.raw(o); },
      close() { if (c.closed) return; c.raw({ type: '_close' }); c.closed = true; c.open = false; clearInterval(c.hb); clearInterval(c.watch); c.emit('close'); },
      start() {
        c.open = true; c.last = Date.now();
        c.hb = setInterval(() => c.raw({ type: '_ping' }), 4000);
        c.watch = setInterval(() => { if (Date.now() - c.last > 15000) c.close(); }, 2000);
        c.emit('open');
      },
      recv(o) {
        c.last = Date.now();
        if (o.type === '_ping' || o.type === '_knock' || o.type === '_ack') return;
        if (o.type === '_close') { c.close(); return; }
        c.emit('data', o);
      }

    return c;

  async function startRelayHost() {
    if (!net || net.relayStarted) return;
    net.relayStarted = true;
    try { await loadMqttLib(); } catch (e) { if (net) { net.relayDead = true; checkFail(); } return; }
    if (!net) return;
    const base = RELAY_BASE + net.code + '/', urls = RELAY_BROKERS();
    net.relayConns = {}; net.mqtt = [];
    urls.forEach(url => {
      let cl;
      try { cl = mqttConnect(url, 'gkh'); } catch (e) { return; }
      net.mqtt.push(cl);
      cl.on('error', () => {});
      cl.on('connect', () => { cl.subscribe(base + 'h'); if (net && !net.relayReady) { net.relayReady = true; onTransportReady(); } });
      cl.on('message', (t, buf) => {
        if (!net) return;
        let o; try { o = JSON.parse(buf.toString()); } catch (e) { return; }
        if (!o || !o.from) return;
        let c = net.relayConns[o.from];
        if (o.type === '_knock') {
          if (!c || c.closed) { c = makeRelayConn(cl, base + 'g/' + o.from); net.relayConns[o.from] = c; attachConn(c); c.start(); }
          c.raw({ type: '_ack' }); return;
        }
        if (c && !c.closed && c.client === cl) c.recv(o);
      });
    });
    watchRelayFail(urls);
  }

  async function startRelayGuest() {
    if (!net || net.relayStarted) return;
    net.relayStarted = true;
    try { await loadMqttLib(); } catch (e) { if (net) { net.relayDead = true; checkFail(); } return; }
    if (!net) return;
    const base = RELAY_BASE + net.code + '/', urls = RELAY_BROKERS();
    net.mqtt = [];
    urls.forEach(url => {
      let cl;
      try { cl = mqttConnect(url, 'gkg'); } catch (e) { return; }
      net.mqtt.push(cl);
      cl.knock = () => { if (net && !(net.conn && net.conn.open)) { try { cl.publish(base + 'h', JSON.stringify({ type: '_knock', from: net.sid })); } catch (e) {} } };
      cl.on('error', () => {});
      cl.on('connect', () => { if (!net) return; net.relayReady = true; cl.subscribe(base + 'g/' + net.sid, () => cl.knock()); });
      cl.on('message', (t, buf) => {
        if (!net) return;
        let o; try { o = JSON.parse(buf.toString()); } catch (e) { return; }
        if (!o) return;
        if (o.type === '_ack') {
          if ((net.relayConn && !net.relayConn.closed) || (net.conn && net.conn.open)) return;
          const c = makeRelayConn(cl, base + 'h', net.sid);
          net.relayConn = c; attachConn(c); c.start(); return;
        }
        if (net.relayConn && !net.relayConn.closed && net.relayConn.client === cl) net.relayConn.recv(o);
      });
    });
    watchRelayFail(urls);
  }

  function connectToHost() {
    if (!net) return;
    net.tick = (net.tick || 0) + 1;
    if (net.tick % 3 === 1) connectP2P();
    (net.mqtt || []).forEach(cl => { if (cl.connected && cl.knock) cl.knock(); });
  }

  async function hostRoom(colorPick, resume) {
    const myColor = colorPick === 0 ? (Math.random() < 0.5 ? 1 : 2) : colorPick;
    net = { role: 'host', code: resume ? resume.code : newCode(), myName, oppName: resume ? resume.oppName : '', myColor: resume ? resume.myColor : myColor,
      v: resume ? resume.v : 0, game: resume ? resume.game : 1, connected: false, started: false, resuming: !!resume, guestSid: resume ? resume.guestSid : null };
    if (resume) { cfg = Object.assign({}, cfg, { mode: 'online' }); net.started = true; loadMoves(resume.moves); render(); }
    else showWaiting();
    const kick = setTimeout(() => startRelayHost(), 4000);   // 직접 연결 서버가 느리면 중계도 바로 준비
    let ok = true;
    try { await loadPeerLib(); } catch (e) { ok = false; }
    if (!net) return;
    if (!ok) { net.p2pDead = true; clearTimeout(kick); startRelayHost(); return; }
    openPeer(PEER_PREFIX + net.code, () => { if (!net) return; net.resuming = false; clearTimeout(kick); startRelayHost(); onTransportReady(); });
  }

  async function joinRoom(code, resume) {
    net = { role: 'guest', code, sid: (resume && resume.sid) || rid(), myName, oppName: resume ? resume.oppName : '', myColor: resume ? resume.myColor : 0,
      v: resume ? resume.v : 0, game: resume ? resume.game : 1, connected: false, started: false };
    if (resume) { cfg = Object.assign({}, cfg, { mode: 'online' }); net.started = true; loadMoves(resume.moves); render(); }
    else {
      openModal('<div style="text-align:center;font-size:36px">🔗</div><div style="text-align:center;font-size:16px;color:#efe6cf;margin-top:6px">방 <b style="color:#f3d98b;letter-spacing:2px">' + esc(code) +
        '</b>에 연결하는 중…</div><div style="text-align:center;font-size:12.5px;color:#a39876;margin-top:8px">직접 연결이 안 되면 중계 서버로 연결해요. 최대 15초쯤 걸릴 수 있어요.</div>',
        [['취소', () => { leaveOnline(); openOnline(); }]]);
      net.joinTimer = setTimeout(() => {
        if (!net || net.connected || net.started) return;
        const c = net.code; leaveOnline();
        openOnline(c, '방 <b>' + esc(c) + '</b>에 연결하지 못했어요. 방 코드가 맞는지, 방장이 아직 방에 있는지 확인해 주세요.');
      }, 16000);
    }
    startRelayGuest();
    loadPeerLib().then(() => { if (net) openPeer(null, () => connectP2P()); }, () => { if (net) { net.p2pDead = true; checkFail(); } });
    scheduleRejoin();
  }

  function showWaiting() {
    if (!net) return;
    const link = inviteLink(net.code);
    openModal('<div style="text-align:center;font-family:' + SERIF + ';color:#d4af37;font-size:20px;letter-spacing:3px">방을 만들었어요</div>' +
      '<div style="text-align:center;font-size:13px;color:#a39876;margin:10px 0 6px">친구에게 방 코드를 알려 주세요</div>' +
      '<div style="text-align:center;font-family:' + SERIF + ';font-size:52px;letter-spacing:14px;color:#f3d98b;text-shadow:0 2px 16px rgba(212,175,55,.45);padding-left:14px">' + net.code + '</div>' +
      '<div style="text-align:center;font-size:13.5px;color:#d9cfb5;margin-top:8px">나는 <b style="color:' + nameColor(net.myColor) + '">' + GK_NAME[net.myColor] + '</b>' + (net.myColor === 1 ? ' (선공)' : ' (후공)') + '</div>' +
      (link ? '<div style="margin-top:14px;background:#14110c;border:1px solid #3a3122;border-radius:8px;padding:8px 10px;font-size:12px;color:#a39876;word-break:break-all;text-align:center">' + esc(link) + '</div>' : '') +
      '<div style="text-align:center;margin-top:14px;font-size:14px;color:#f3d98b;animation:gkBlink 1.4s ease-in-out infinite">' + ((net.peer && net.peer.open) || net.relayReady ? '상대를 기다리는 중…' : '방을 여는 중…') + '</div>',
      [['나가기', () => { leaveOnline(); closeModal(); }], ['🔗 초대 링크 복사', () => {
        try { navigator.clipboard.writeText(link).then(() => toast('링크를 복사했어요', true)); } catch (e) { toast('복사가 안 되면 링크를 직접 알려 주세요'); }
      }, true]]);
  }

  function openOnline(prefill, err) {
    stopAI();
    const tmp = { color: 1, code: (prefill || '').toUpperCase() };
    const inp = 'width:100%;box-sizing:border-box;background:#14110c;border:1px solid #5a4b2c;border-radius:9px;padding:11px 12px;color:#efe6cf;font-size:16px;font-family:' + SANS + ';outline:none';
    const chip = (on, label) => '<div style="flex:1;cursor:pointer;text-align:center;padding:9px 4px;border-radius:9px;border:1px solid ' + (on ? '#d4af37' : '#3a3122') +
      ';background:' + (on ? '#3a2e14' : '#14110c') + ';color:' + (on ? '#f3d98b' : '#cfc5aa') + ';font-size:14px;font-weight:' + (on ? 700 : 500) + '">' + label + '</div>';
    function draw() {
      openModal('<div style="font-family:' + SERIF + ';color:#d4af37;font-size:22px;text-align:center;letter-spacing:3px">🌐 온라인 대전</div>' +
        (err ? '<div style="margin-top:12px;background:#2a0f0c;border:1px solid #e0473a;border-radius:8px;padding:9px 12px;font-size:13.5px;color:#ffd6d0">' + err + '</div>' : '') +
        '<div style="font-size:12px;color:#a39876;letter-spacing:3px;margin:16px 0 6px">내 이름</div>' +
        '<input id="gkName" maxlength="10" placeholder="예: 3반 재욱" value="' + esc(myName) + '" style="' + inp + '">' +
        '<div style="display:flex;gap:12px;margin-top:16px">' +
        '<div style="flex:1;background:#14110c;border:1px solid #3a3122;border-radius:12px;padding:12px">' +
        '<div style="font-size:15px;color:#f3d98b;font-weight:700;margin-bottom:8px">방 만들기</div>' +
        '<div style="font-size:12px;color:#a39876;margin-bottom:6px">내 색</div><div style="display:flex;gap:5px" id="gkColor">' +
        chip(tmp.color === 1, '파랑') + chip(tmp.color === 2, '주황') + chip(tmp.color === 0, '무작위') + '</div>' +
        '<button id="gkHost" class="gk-btn" style="margin-top:10px;width:100%;background:#3a2e14;color:#f3d98b;border:1px solid #d4af37;border-radius:9px;padding:10px;font-size:15px;font-weight:700;font-family:' + SANS + ';cursor:pointer">방 만들기</button></div>' +
        '<div style="flex:1;background:#14110c;border:1px solid #3a3122;border-radius:12px;padding:12px">' +
        '<div style="font-size:15px;color:#f3d98b;font-weight:700;margin-bottom:8px">방 참가</div>' +
        '<div style="font-size:12px;color:#a39876;margin-bottom:6px">방 코드 (4자리)</div>' +
        '<input id="gkCode" maxlength="4" placeholder="ABCD" value="' + esc(tmp.code) + '" style="' + inp + ';text-transform:uppercase;letter-spacing:6px;text-align:center;font-size:20px;padding:7px">' +
        '<button id="gkJoin" class="gk-btn" style="margin-top:10px;width:100%;background:#3a2e14;color:#f3d98b;border:1px solid #d4af37;border-radius:9px;padding:10px;font-size:15px;font-weight:700;font-family:' + SANS + ';cursor:pointer">참가하기</button></div></div>' +
        '<div style="font-size:12px;color:#8a7f63;margin-top:12px;line-height:1.6">같은 방 코드를 입력하면 다른 컴퓨터·태블릿과 대결할 수 있어요. 대화는 정해진 문구로만 주고받아요.</div>',
        [['닫기', closeModal]], true, true);
      const nameIn = modal.querySelector('#gkName'), codeIn = modal.querySelector('#gkCode');
      const keep = () => { myName = nameIn.value.trim().slice(0, 10); tmp.code = codeIn.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4); try { localStorage.setItem('gkName', myName); } catch (e) {} };
      nameIn.addEventListener('input', keep); codeIn.addEventListener('input', () => { keep(); codeIn.value = tmp.code; });
      Array.from(modal.querySelector('#gkColor').children).forEach((ch, k) => ch.addEventListener('click', () => { keep(); tmp.color = [1, 2, 0][k]; err = ''; draw(); }));
      modal.querySelector('#gkHost').addEventListener('click', () => {
        keep(); if (!myName) { err = '이름을 먼저 입력해 주세요.'; draw(); return; }
        if (net) leaveOnline(); hostRoom(tmp.color);
      });
      modal.querySelector('#gkJoin').addEventListener('click', () => {
        keep(); if (!myName) { err = '이름을 먼저 입력해 주세요.'; draw(); return; }
        if (tmp.code.length !== 4) { err = '방 코드 4자리를 입력해 주세요.'; draw(); return; }
        if (net) leaveOnline(); joinRoom(tmp.code);
      });
    }
    draw();
  }

  window.addEventListener('beforeunload', () => saveSession());

  function startup() {
    let saved = null;
    try { saved = JSON.parse(lsGet('gkOnline') || 'null'); } catch (e) {}
    let roomParam = '';
    try { roomParam = (new URLSearchParams(location.search).get('room') || '').toUpperCase().slice(0, 4); } catch (e) {}
    if (saved && saved.code && (!roomParam || roomParam === saved.code)) {
      openModal('<div style="text-align:center;font-size:36px">🌐</div><div style="text-align:center;font-size:16px;color:#efe6cf;margin-top:6px">방 <b style="color:#f3d98b;letter-spacing:2px">' + esc(saved.code) +
        '</b>에서 하던 온라인 대전이 있어요.</div>',
        [['그만하기', () => { lsSet('gkOnline', null); closeModal(); openHome(); }], ['이어서 하기', () => {
          myName = saved.myName || myName; closeModal();
          if (saved.role === 'host') hostRoom(saved.myColor, saved); else joinRoom(saved.code, saved);
        }, true]]);
      return;
    }
    if (roomParam) { openOnline(roomParam); return; }
    openHome();
  }

  render();
  startup();
  return () => { stopAI(); if (net) leaveOnline(); window.removeEventListener('keydown', onKey); root.innerHTML = ''; };
}

mountGreatKingdom(document.getElementById("app"));
</script></body></html>
